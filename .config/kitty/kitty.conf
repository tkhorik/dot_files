include theme.conf
include tabs.conf
include font-size.conf
allow_remote_control yes
listen_on unix:/tmp/mykitty
map cmd+equal launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size increase
map cmd+plus launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size increase
map cmd+kp_add launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size increase
map cmd+minus launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size decrease
map cmd+kp_subtract launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size decrease
map cmd+0 launch --type=background --allow-remote-control /Users/marv/bin/kitty-font-size reset

cursor_trail 3
cursor_trail_decay 0.1 0.4


# Ctrl shortcuts with the standard Russian layout
map ctrl+ф send_key ctrl+a
map ctrl+и send_key ctrl+b
map ctrl+с send_key ctrl+c
map ctrl+в send_key ctrl+d
map ctrl+у send_key ctrl+e
map ctrl+а send_key ctrl+f
map ctrl+п send_key ctrl+g
map ctrl+р send_key ctrl+h
map ctrl+ш send_key ctrl+i
map ctrl+о send_key ctrl+j
map ctrl+л send_key ctrl+k
map ctrl+д send_key ctrl+l
map ctrl+ь send_key ctrl+m
map ctrl+т send_key ctrl+n
map ctrl+щ send_key ctrl+o
map ctrl+з send_key ctrl+p
map ctrl+й send_key ctrl+q
map ctrl+к send_key ctrl+r
map ctrl+ы send_key ctrl+s
map ctrl+е send_key ctrl+t
map ctrl+г send_key ctrl+u
map ctrl+м send_key ctrl+v
map ctrl+ц send_key ctrl+w
map ctrl+ч send_key ctrl+x
map ctrl+н send_key ctrl+y
map ctrl+я send_key ctrl+z
