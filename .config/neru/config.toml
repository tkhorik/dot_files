[general]
hide_overlay_in_screen_share = true
passthrough_unbounded_keys = true
should_exit_after_passthrough = true

mode_exit_keys = ["escape", "Ctrl+C"]

[hotkeys]
# disable defaults
"Cmd+Shift+Space" = "__disabled__"
"Cmd+Shift+G" = "__disabled__"
"Cmd+Shift+C" = "__disabled__"
"Cmd+Shift+S" = "__disabled__"


"Ctrl+K" = ["action left_click", "idle"]
"Ctrl+S" = "scroll"
"Ctrl+J" = ["recursive_grid --action left_click"]
# "Shift+Space" = ["recursive_grid --action left_click --repeat"]

"Option+Escape" = "recursive_grid --cursor-selection-mode hold"
"Option+Cmd+Space" = "action right_click"

# [action.key_bindings]
# left_click = "Return"
# right_click = "Ctrl+R"
# middle_click = "Ctrl+M"

# These keys dont have to be here, i didn't want to install another program to run these
"Cmd+Alt+Shift+Ctrl+F" = "exec open -a \"Finder\""
"Cmd+Alt+Shift+Ctrl+B" = "exec open -a \"Helium\""
# "Cmd+Alt+Shift+Ctrl+B" = "exec open -a \"Safari Technology Preview\""
"Cmd+Alt+Shift+Ctrl+T" = "exec open -a \"Kitty\""
"Cmd+Alt+Shift+Ctrl+N" = "exec open -a \"Notes\""
# "Cmd+Alt+Shift+Ctrl+R" = "exec open -a \"Reminders\""
# "Cmd+Alt+Shift+Ctrl+M" = "exec open -a \"Mail\""
# "Cmd+Alt+Shift+Ctrl+C" = "exec open -a \"Calendar\""
# "Cmd+Alt+Shift+Ctrl+W" = "exec open -a \"WhatsApp\""
"Cmd+Alt+Shift+Ctrl+P" = "exec open -a \"1Passwords\""
"Cmd+Alt+Shift+Ctrl+S" = "exec open -a \"System Settings\""
"Cmd+Alt+Shift+Ctrl+A" = "exec open -a \"Activity Monitor\""

# "Alt+Shift+1" = "exec move-to-space 1"
# "Alt+Shift+2" = "exec move-to-space 2"
# "Alt+Shift+3" = "exec move-to-space 3"
# "Alt+Shift+4" = "exec move-to-space 4"
# "Alt+Shift+5" = "exec move-to-space 5"
# "Alt+Shift+6" = "exec move-to-space 6"
# "Alt+Shift+7" = "exec move-to-space 7"
# "Alt+Shift+8" = "exec move-to-space 8"
# "Alt+Shift+9" = "exec move-to-space 9"

[recursive_grid]
min_size_height = 5
min_size_width = 5
max_depth = 3
reset_key = ","

keys = "qwertyuiopasdfghjklnzxcvb"
grid_cols = 5
grid_rows = 5

[recursive_grid.ui]
line_width = 0
font_size = 10
font_family = ""

highlight_color = { light = "#00000000", dark = "#00000000" }

label_background = false
label_background_color = { light = "#00000000", dark = "#00000000" }
label_background_padding_x = -1
label_background_padding_y = -1
label_background_border_radius = -1
label_background_border_width = 1

sub_key_preview = false
sub_key_preview_font_size = 8
sub_key_preview_autohide_multiplier = 1.5
sub_key_preview_text_color = { light = "#00000000", dark = "#00000000" }

[recursive_grid.hotkeys]
"Up" = "action move_mouse_relative --dx=0 --dy=-25"
"Down" = "action move_mouse_relative --dx=0 --dy=25"
"Left" = "action move_mouse_relative --dx=-25 --dy=0"
"Right" = "action move_mouse_relative --dx=25 --dy=0"

"Cmd+Up" = "action move_mouse_relative --dx=0 --dy=-150"
"Cmd+Down" = "action move_mouse_relative --dx=0 --dy=150"
"Cmd+Left" = "action move_mouse_relative --dx=-150 --dy=0"
"Cmd+Right" = "action move_mouse_relative --dx=150 --dy=0"

"Shift+Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Shift+Down" = "action move_mouse_relative --dx=0 --dy=5"
"Shift+Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Shift+Right" = "action move_mouse_relative --dx=5 --dy=0"

"Space" = ["action left_click", "idle"]
"Shift+K" = ["action left_click", "action reset"]
# "Shift+Space" = ["action left_click", "action reset"]
"Ctrl+Space" = ["action right_click", "idle"]
# "Cmd+Space" = ["action right_click", "idle"]
"Cmd+Shift+Space" = ["action right_click", "action reset"]

"Shift+M" = "action middle_click"
"Shift+D" = "action mouse_down"
"Shift+U" = "action mouse_up"

"`" = "toggle-cursor-follow-selection"
"," = "action reset"
"." = ["action move_mouse", "scroll"]

"Ctrl+J" = "action scroll_down"
"Ctrl+K" = "action scroll_up"
"Ctrl+H" = "action scroll_left"
"Ctrl+L" = "action scroll_right"
"Ctrl+U" = "action page_up"
"Ctrl+D" = "action page_down"
"Ctrl+T" = "action go_top"
"Ctrl+B" = "action go_bottom"
"Ctrl+M" = "action move_mouse"

"Shift+L" = "__disabled__"
"Shift+R" = "__disabled__"
"Shift+I" = "__disabled__"

[recursive_grid.animation]
enabled = true
duration_ms = 50

[scroll]
stay_active_in_background = true

[scroll.hotkeys]
"t" = "action go_top"
"b" = "action go_bottom"

[mode_indicator.ui]
font_size = 4
border_radius = 50
border_color = "#00000000"
 border_width= 0
padding_x = -1
padding_y = -1
indicator_x_offset = 10
indicator_y_offset = -20

[mode_indicator.scroll]
enabled = true
text = " "
background_color = "#FF00CF55"

[mode_indicator.recursive_grid]
enabled = true
text = " "

[smooth_cursor]
move_mouse_enabled = true                   # Enable smooth mouse movement
steps = 10                                  # Number of intermediate positions
max_duration = 200                          # Maximum animation duration in ms
duration_per_pixel = 0.1                    # Ms per pixel for adaptive duration

[systray]
enabled = true
